<!DOCTYPE html>
<html>


<head>

<meta charset="UTF-8">
	
<title>HTML Practice 6 - Tables</title>

<style type="text/css">
   .center {
      text-align: center;
   }
   .table {
      margin: auto;
      width: 550px;
   }
   .caption {
      color: #003300;
      font-size: 24px;
      font-weight: bold;
   }
   .courses{
      background-color: #CCCCCC;
      width: 25%;
   }

   .days {
    width: 75%;
   }
   .daysheader {
    background-color: #99FF66;
}


</style>
</head>
<body>
<div class ="center">
   <table class="table" border="1" cellspacing="0" cellpadding="10">
      <caption class="caption">My Class Schedule</caption>
      <colgroup class="courses"></colgroup>
      <colgroup class="days" span="5"></colgroup>

      <tr>
         <th>Courses</th>
         <th class="daysheader">Monday</th>
         <th class="daysheader">Tuesday</th>
         <th class="daysheader">Wednesday</th>
         <th class="daysheader">Thursday</th>
         <th class="daysheader">Friday</th>
      </tr>
      <tr>
         <th>INFO 1120</th>
         <td></td>
         <td>9-11</td>
         <td></td>
         <td>9-11</td>
         <td rowspan="2"></td>
      </tr>
      <tr>
         <th>MATH 1010</th>
         <td colspan="4">12-1</td>
      </tr>
      <tr>
         <th>INFO 2420</th>
         <td colspan="5">Online Available 24/7</td>
      </tr>
	
   </table>
</div>



</body>
</html>
